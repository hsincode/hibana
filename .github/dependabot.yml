# Version updates for what the workflows run: the actions (pinned by commit
# SHA) and the Vercel CLI (pinned by tools/vercel/bun.lock). The application
# dependencies are not listed: updating the root lockfile redeploys the bot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /tools/vercel
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
