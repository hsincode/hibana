name: CI
on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: make ci
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t hibana-bot:ci .
      - run: docker run --rm --network none -e LOG_DIR= hibana-bot:ci bun src/main.ts --check
  changes:
    # Runs only after all checks pass. push and workflow_dispatch on main deploy;
    # workflow_dispatch redeploys everything (scripts/deploy-changes.ts).
    needs: [checks, container]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      bot: ${{ steps.detect.outputs.bot }}
      base: ${{ steps.detect.outputs.base }}
      vercel: ${{ steps.detect.outputs.vercel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - id: detect
        # The relay is asked which commit production runs (docs/adr/0001); its
        # key is the deploy key, which may read /status but not the bot's logs.
        run: |
          bun scripts/deploy-changes.ts "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # Vercel deploys stay skipped until the secret VERCEL_TOKEN exists.
          echo "vercel=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_DEPLOY_TOKEN }}
  deploy-api:
    # The API goes first: the dashboard and bot may send settings fields that
    # only the new API accepts (same order as the local deploy script).
    needs: changes
    if: needs.changes.outputs.api == 'true' && needs.changes.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    # A job with an environment leaves a GitHub Deployment: target, commit,
    # result and this run's URL, kept without the retention limit of run logs.
    environment:
      name: production-api
      url: https://api.bot.hsincode.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      # The CLI and its dependency tree are pinned by tools/vercel/bun.lock.
      - run: bun install --frozen-lockfile
        working-directory: tools/vercel
      # Stage, verify, promote (docs/adr/0005): the build is made for production
      # but no domain points at it until scripts/verify-deployment.ts has passed.
      # Uploads from the repo root; the project's Root Directory (apps/api) and
      # vercel.json select the app, as with the CLI deploy in docs/production.md.
      - id: stage
        run: |
          url=$(tools/vercel/node_modules/.bin/vercel deploy --prod --skip-domain --yes --env HIBANA_COMMIT="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NI6RY3w0UOIKwEyPPiGW6pbx
          VERCEL_PROJECT_ID: prj_7xZMMMwuGPPtmB19oS6XdqOrV3xS
      - run: bun scripts/verify-deployment.ts api "$STAGED_URL" "$GITHUB_SHA"
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_API }}
      - run: tools/vercel/node_modules/.bin/vercel promote "$STAGED_URL" --yes
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NI6RY3w0UOIKwEyPPiGW6pbx
          VERCEL_PROJECT_ID: prj_7xZMMMwuGPPtmB19oS6XdqOrV3xS
  deploy-web:
    needs: [changes, deploy-api]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && needs.changes.outputs.web == 'true' && needs.changes.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://bot.hsincode.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
        working-directory: tools/vercel
      # The commit goes in at build time: the page is static HTML.
      - id: stage
        run: |
          url=$(tools/vercel/node_modules/.bin/vercel deploy --prod --skip-domain --yes --build-env HIBANA_COMMIT="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NI6RY3w0UOIKwEyPPiGW6pbx
          VERCEL_PROJECT_ID: prj_1MzLs7iPZL6S7PtJALAQb72zI2PC
      - run: bun scripts/verify-deployment.ts web "$STAGED_URL" "$GITHUB_SHA"
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_WEB }}
      - run: tools/vercel/node_modules/.bin/vercel promote "$STAGED_URL" --yes
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NI6RY3w0UOIKwEyPPiGW6pbx
          VERCEL_PROJECT_ID: prj_1MzLs7iPZL6S7PtJALAQb72zI2PC
  deploy:
    # Skipped until the relay is set up (repository variable RELAY_URL and
    # secret RELAY_DEPLOY_TOKEN, a key with only the `deploy` scope).
    # The workflow-level concurrency cancels this job when a newer push arrives;
    # the relay finishes the deploy it already started and the newer run follows.
    # The bot deploys the main head, and only when a path it runs from changed
    # since the commit in production; it waits for the API like the web.
    needs: [changes, deploy-api]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && vars.RELAY_URL != '' && needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    # Recorded as successful when the relay answers `superseded` too: that run
    # changed nothing and the newer push records the deploy that did.
    environment:
      name: production-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/relay-deploy.sh "$GITHUB_SHA"
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_DEPLOY_TOKEN }}
  notify:
    # Reports every deploy, failed ones included, to Discord. Skipped until the
    # secret DISCORD_DEPLOY_WEBHOOK exists (the script exits quietly without it).
    needs: [changes, deploy-api, deploy-web, deploy]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.deploy-api.result != 'skipped' || needs.deploy-web.result != 'skipped'
      || needs.deploy.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/deploy-notify.sh "$GITHUB_SHA"
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          BASE: ${{ needs.changes.outputs.base }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          BOT_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
