name: Sandbox image
# Builds apps/bot/sandbox and, on main, publishes it to ghcr.io. The tag is the
# git tree hash of the directory: it changes when, and only when, a file below
# it changes, so one tag never names two different contents (docs/adr/0007).
on:
  push:
    branches: [main]
    paths: ["apps/bot/sandbox/**", ".github/workflows/sandbox-image.yml"]
  pull_request:
    paths: ["apps/bot/sandbox/**", ".github/workflows/sandbox-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hsincode/hibana-sandbox
      # Pull requests only build and check; publishing needs main.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "ref=$IMAGE:$(git rev-parse HEAD:apps/bot/sandbox)" >> "$GITHUB_OUTPUT"
      - id: published
        if: env.PUBLISH == 'true'
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # An existing tag is the same content: nothing to build or overwrite.
          if docker manifest inspect "$REF" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF: ${{ steps.tag.outputs.ref }}
      - if: steps.published.outputs.found != 'true'
        run: >-
          docker build -t "$REF"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          apps/bot/sandbox
        env:
          REF: ${{ steps.tag.outputs.ref }}
      # The image's default command starts each bundled tool once.
      - if: steps.published.outputs.found != 'true'
        run: docker run --rm --network none "$REF"
        env:
          REF: ${{ steps.tag.outputs.ref }}
      - if: steps.published.outputs.found != 'true' && env.PUBLISH == 'true'
        run: |
          docker push "$REF"
          echo "published \`$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ steps.tag.outputs.ref }}
