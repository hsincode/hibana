# HTTP/CONNECT proxy for Hibana's host-side web calls (Exa search,
# download_file). Reachable only through the container's published loopback
# port, so the ACLs below just keep the docker bridge in and everything else out.
User tinyproxy
Group tinyproxy

# Rewritten by entrypoint.sh from VPN_PROXY_PORT.
Port 8118
Listen 0.0.0.0
Timeout 600

# Small VPS: a handful of concurrent downloads is plenty.
MaxClients 64
StartServers 2
MinSpareServers 2
MaxSpareServers 8

PidFile "/tmp/tinyproxy.pid"
# No LogFile + Syslog Off ⇒ log to stdout, which `docker logs` picks up.
Syslog Off
LogLevel Warning

# 127.0.0.1: joined containers (yt-dlp shares this netns).
# RFC1918: docker-proxy forwards the published port from the bridge gateway.
Allow 127.0.0.0/8
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS goes through CONNECT; keep the port list minimal.
ConnectPort 443
ConnectPort 563

# Do not advertise the proxy hop to the origin site.
DisableViaHeader Yes
