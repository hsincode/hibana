<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>会議の録音</title>
    <style>
      /* Speakers wear the validated categorical palette, in fixed order
         (light and dark stepped separately); a ninth speaker is gray. */
      :root {
        color-scheme: light;
        --bg: #f4f4f2;
        --surface: #fcfcfb;
        --surface-2: #f0efec;
        --line: #e3e2de;
        --text: #0b0b0b;
        --text-2: #52514e;
        --text-3: #7a7974;
        --accent: #2a78d6;
        --accent-ink: #ffffff;
        --danger: #c62f2e;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.06);
        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #eda100;
        --s5: #e87ba4;
        --s6: #008300;
        --s7: #6250d6;
        --s8: #e34948;
        --s-other: #8a8984;
        --radius: 16px;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          "Yu Gothic UI",
          sans-serif;
        font-feature-settings: "palt";
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #111110;
          --surface: #1a1a19;
          --surface-2: #232321;
          --line: #2e2e2b;
          --text: #f0efec;
          --text-2: #c3c2b7;
          --text-3: #8f8e86;
          --accent: #3987e5;
          --danger: #e66767;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.35);
          --s1: #3987e5;
          --s2: #d95926;
          --s3: #199e70;
          --s4: #c98500;
          --s5: #d55181;
          --s6: #008300;
          --s7: #9085e9;
          --s8: #e66767;
          --s-other: #75746e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        max-width: 880px;
        margin: 0 auto;
        padding: 40px 20px 96px;
        display: grid;
        gap: 16px;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .muted {
        color: var(--text-3);
      }

      /* Header */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-2);
      }
      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--s8);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--s8) 18%, transparent);
      }
      h1 {
        font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem);
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 10px 0 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .chip {
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 0.85rem;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .chip.expiry {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      }
      .sub {
        margin: 12px 0 0;
        font-size: 0.85rem;
        color: var(--text-3);
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      .card h2 {
        font-size: 0.95rem;
        margin: 0;
        letter-spacing: 0.01em;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-bottom: 14px;
      }
      .card-head .grow {
        flex: 1;
      }

      /* Player */
      .player {
        position: sticky;
        top: 12px;
        z-index: 2;
        backdrop-filter: saturate(1.4) blur(12px);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .play {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 0;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        box-shadow: 0 6px 16px
          color-mix(in srgb, var(--accent) 35%, transparent);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .play:hover:not(:disabled) {
        transform: scale(1.05);
      }
      .play svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .skip {
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-2);
      }
      .clock {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        color: var(--text-2);
      }
      .clock strong {
        color: var(--text);
        font-weight: 600;
      }

      .timeline {
        position: relative;
        margin-top: 18px;
      }
      #lanes {
        display: grid;
        gap: 6px;
      }
      .lane {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 10px;
        transition: opacity 0.2s ease;
      }
      .lane.muted {
        opacity: 0.3;
      }
      .lane-name {
        font-size: 0.78rem;
        color: var(--text-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track {
        position: relative;
        height: 14px;
        border-radius: 4px;
        background: var(--surface-2);
        cursor: pointer;
      }
      .seg {
        position: absolute;
        top: 2px;
        bottom: 2px;
        border-radius: 4px;
        background: var(--c);
      }
      .seg:hover {
        top: 0;
        bottom: 0;
      }
      .heads {
        position: absolute;
        inset: 0 0 0 98px;
        pointer-events: none;
      }
      #playhead {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 2px;
        margin-left: -1px;
        border-radius: 2px;
        background: var(--text);
        left: 0;
      }
      /* Wider than the lanes by half the thumb on each side, so the thumb's
         center lines up with the playhead. */
      .scrub {
        margin: 14px -8px 0 90px;
        width: calc(100% - 82px);
        display: block;
      }
      input[type="range"] {
        appearance: none;
        height: 6px;
        border-radius: 999px;
        /* Filled up to the thumb's center (16 px wide). */
        background: linear-gradient(
          to right,
          var(--accent) calc(8px + (100% - 16px) * var(--f, 0)),
          var(--surface-2) 0
        );
        outline-offset: 6px;
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--accent);
        box-shadow: var(--shadow);
      }
      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--accent);
      }
      .speakers {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .speakers .label {
        font-size: 0.8rem;
        color: var(--text-3);
        margin-right: 2px;
      }
      .speaker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        font-size: 0.85rem;
      }
      .speaker .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c);
      }
      .speaker[aria-pressed="false"] {
        background: transparent;
        color: var(--text-3);
        text-decoration: line-through;
      }
      .speaker[aria-pressed="false"] .dot {
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--c);
      }

      /* Download */
      .download-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      select {
        flex: 1 1 220px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface-2);
      }
      .primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        border: 0;
        background: var(--text);
        color: var(--surface);
        font-weight: 600;
      }
      .primary svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      progress {
        width: 100%;
        height: 6px;
        margin-top: 14px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        overflow: hidden;
        background: var(--surface-2);
      }
      progress::-webkit-progress-bar {
        background: var(--surface-2);
      }
      progress::-webkit-progress-value {
        background: var(--accent);
        border-radius: 999px;
      }
      progress::-moz-progress-bar {
        background: var(--accent);
      }
      .note {
        margin: 10px 0 0;
        font-size: 0.8rem;
        color: var(--text-3);
      }

      /* Status */
      #status {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--text);
        color: var(--surface);
        font-size: 0.85rem;
        box-shadow: var(--shadow);
        z-index: 3;
      }
      #status[data-tone="error"] {
        background: var(--danger);
        color: #fff;
      }

      /* Transcript */
      .search {
        position: relative;
        flex: 0 1 240px;
      }
      .search input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface-2);
      }
      .search svg {
        position: absolute;
        left: 11px;
        top: 50%;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        fill: none;
        stroke: var(--text-3);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--text-2);
        cursor: pointer;
      }
      .toggle input {
        accent-color: var(--accent);
      }
      .count {
        font-size: 0.8rem;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      #lines {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .line {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 10px 10px;
        border-radius: 12px;
        transition: background 0.2s ease;
        scroll-margin: 260px 0 24px;
      }
      .line:hover {
        background: var(--surface-2);
      }
      .line.current,
      .line.solo {
        background: color-mix(in srgb, var(--c) 12%, transparent);
        box-shadow: inset 3px 0 0 var(--c);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.9rem;
        font-weight: 700;
        color: #fff;
        background: var(--c);
      }
      .who {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .name {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .time {
        border: 0;
        padding: 0;
        background: none;
        font-size: 0.78rem;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .time:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .text {
        margin: 2px 0 0;
        overflow-wrap: anywhere;
      }
      .line-play {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        display: grid;
        place-items: center;
        color: var(--text-2);
        opacity: 0.7;
        transition: opacity 0.15s ease;
      }
      .line:hover .line-play,
      .line-play:focus-visible,
      .line.solo .line-play {
        opacity: 1;
      }
      .line-play svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      .empty {
        color: var(--text-3);
        padding: 12px;
      }
      @media (max-width: 560px) {
        .shell {
          padding-top: 24px;
        }
        .lane {
          grid-template-columns: 56px 1fr;
        }
        .heads {
          left: 66px;
        }
        .scrub {
          margin-left: 58px;
          width: calc(100% - 50px);
        }
        /* A small screen keeps the transcript in view. */
        .player {
          position: static;
        }
        .skip {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script type="module" src="player.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <span class="eyebrow">会議の録音</span>
        <h1 id="title">会議の録音</h1>
        <ul class="chips" id="chips">
          <li class="chip expiry" id="expires"></li>
        </ul>
        <p class="sub">
          <span id="ending"></span>
          参加者: <span id="participants"></span>
        </p>
      </header>

      <section class="card player" aria-label="再生">
        <div class="transport">
          <button
            type="button"
            class="play"
            id="play"
            aria-label="再生"
          ></button>
          <button type="button" class="skip" id="back" aria-label="10 秒戻る">
            −10秒
          </button>
          <button type="button" class="skip" id="ahead" aria-label="10 秒進む">
            +10秒
          </button>
          <span class="clock"
            ><strong id="now">00:00:00</strong> /
            <span id="total">00:00:00</span></span
          >
        </div>
        <div class="timeline">
          <div id="lanes" aria-label="話者ごとの発言の区間"></div>
          <div class="heads" aria-hidden="true">
            <span id="playhead"></span>
          </div>
          <input
            type="range"
            class="scrub"
            id="seek"
            min="0"
            max="0"
            step="any"
            value="0"
            aria-label="再生位置"
          />
        </div>
        <div class="speakers" id="speakers">
          <span class="label">聞く人</span>
        </div>
      </section>

      <section class="card" aria-label="ダウンロード">
        <div class="card-head"><h2>ダウンロード</h2></div>
        <div class="download-row">
          <select id="who" aria-label="ダウンロードする音声"></select>
          <button type="button" class="primary" id="download">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" />
            </svg>
            ダウンロード
          </button>
        </div>
        <progress id="progress" max="1" value="0" hidden></progress>
        <p class="note">
          音声はこのブラウザの中で重ねて作ります。長い会議では時間がかかります。
        </p>
      </section>

      <section class="card" aria-label="全文">
        <div class="card-head">
          <h2>全文</h2>
          <span class="count" id="count"></span>
          <span class="grow"></span>
          <label class="toggle"
            ><input type="checkbox" id="follow" checked /> 再生位置に追従</label
          >
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4 4" />
            </svg>
            <input
              type="search"
              id="find"
              placeholder="全文を検索"
              aria-label="全文を検索"
            />
          </label>
        </div>
        <p class="note" style="margin: -6px 0 12px">
          自動の文字起こしです。聞き取りの誤りを含むことがあります。
        </p>
        <ol id="lines"></ol>
      </section>
    </main>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </body>
</html>
